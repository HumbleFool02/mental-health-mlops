name: Deploy to EC2

# Manual trigger only — run from the Actions tab when you want to push a new
# version to the production instance.
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   EC2_HOST       — Elastic IP of the EC2 instance (e.g. 1.2.3.4)
#   EC2_SSH_KEY    — PEM private key for SSH access (the full file content)
#
# The instance must have Docker installed and the repo already cloned at
# /home/ubuntu/mental-health-mlops (with models/ populated — not in git).
# This workflow pulls the latest code and rebuilds the container in-place.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/mental-health-mlops

            echo "--- pulling latest code ---"
            git pull origin main

            echo "--- building image ---"
            docker build -t mental-health-api -f Dockerfile.lightweight .

            echo "--- swapping container ---"
            docker stop mental-health-api 2>/dev/null || true
            docker rm   mental-health-api 2>/dev/null || true
            docker run -d \
              --name mental-health-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -p 8501:8501 \
              mental-health-api

            echo "--- pruning old images ---"
            docker image prune -f

      - name: Health check
        # Wait up to 90 s for the API to respond after container swap.
        run: |
          echo "Waiting for API to come up..."
          for i in $(seq 1 18); do
            if curl -sf "http://${{ secrets.EC2_HOST }}:8000/health" > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/18 — retrying in 5 s..."
            sleep 5
          done
          echo "Health check failed after 90 s"
          exit 1
