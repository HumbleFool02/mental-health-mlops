name: Deploy to EC2

# Manual trigger only — run from the Actions tab when you want to push a new
# version to the production instance.
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   EC2_HOST               — Elastic IP of the EC2 instance
#   EC2_USER               — SSH username (e.g. ubuntu)
#   EC2_SSH_KEY            — PEM private key for SSH access (full file content)
#   AWS_ACCESS_KEY_ID      — IAM key with read access to mental-health-mlops-models
#   AWS_SECRET_ACCESS_KEY  — corresponding secret
#
# The instance must have Docker installed and the repo cloned at
# ~/mental-health-mlops.  The model is downloaded from S3 during docker build,
# so no model files need to be present on the instance beforehand.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Forward the AWS credentials set above into the remote shell so the
          # docker build --build-arg lines below can reference them.
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/mental-health-mlops

            echo "--- pulling latest code ---"
            git pull origin main

            echo "--- building image (downloads model from S3) ---"
            docker build -f Dockerfile.lightweight \
              --build-arg AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              --build-arg AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              --build-arg AWS_DEFAULT_REGION=us-east-1 \
              -t mental-health-mlops:latest .

            echo "--- swapping container ---"
            docker stop mlops-app 2>/dev/null || true
            docker rm   mlops-app 2>/dev/null || true
            docker run -d \
              --name mlops-app \
              --restart unless-stopped \
              -p 8000:8000 \
              -p 8501:8501 \
              mental-health-mlops:latest

            echo "--- pruning old images ---"
            docker image prune -f

      - name: Health check
        # Wait up to 90 s for the API to respond after container swap.
        run: |
          echo "Waiting for API to come up..."
          for i in $(seq 1 18); do
            if curl -sf "http://${{ secrets.EC2_HOST }}:8000/health" > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/18 — retrying in 5 s..."
            sleep 5
          done
          echo "Health check failed after 90 s"
          exit 1
